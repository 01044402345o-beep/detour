<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Edulleo — My order (C2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F7FB; --surface:#FFFFFF; --line:#DCE3EE; --ink:#0F1B33; --mute:#55627A;
  --blue:#1D5BD6; --blue-deep:#0E3A8F; --tint:#E6EEFB; --on-blue:#FFFFFF;
  --signal:#FFB21A; --ok:#17703D; --scrim:8,20,46;
  --sans:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px; --gut:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{height:56px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 6px;text-align:center}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
.top h1{font-size:17px;font-weight:700}
.sub{padding:0 var(--gut);font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px}
.sub img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.say{margin:14px var(--gut) 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px 18px}
.say .ko{word-break:keep-all;font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.say .ro{margin-top:10px;font-size:16px;color:var(--mute)}
.say .me{margin-top:4px;font-size:17px;font-weight:500}
.lis{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lis button{height:48px;border-radius:12px;background:var(--tint);color:var(--blue);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
.seg{margin:16px var(--gut) 0;height:50px;padding:3px;border-radius:12px;background:#E3E9F2;display:grid;grid-template-columns:1fr 1fr}
.seg button{border-radius:9px;font-size:16px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(15,27,51,.15),inset 0 0 0 2px var(--blue)}
.item{margin:14px var(--gut) 0;display:grid;grid-template-columns:1fr auto;align-items:center;min-height:72px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.item b{display:block;font-size:17px;font-weight:600}
.item span{font-size:14px;color:var(--mute)}
.step{display:flex;align-items:center;border:1px solid var(--blue);background:var(--surface);border-radius:24px;height:46px}
.step button{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:var(--blue)}
.step .plus{background:var(--blue);color:var(--on-blue)}
.step .q{width:26px;text-align:center;font-family:var(--num);font-size:17px;font-weight:600}
.est{margin:0 var(--gut);height:54px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--mute)}
.est .n{font-size:22px;font-weight:600;color:var(--ink)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px var(--gut) 24px;background:var(--surface);border-top:1px solid var(--line);display:grid;gap:10px}
.cta{height:60px;border-radius:12px;background:var(--blue);color:var(--on-blue);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.sec{height:52px;border-radius:12px;border:1px solid var(--line);color:var(--ink);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.sec svg{color:var(--blue)}
</style></head>
<body>
<header class="top">
  <button class="ib" aria-label="Back to menu"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1>My order</h1><span></span>
</header>
<p class="sub">Sungsimdang Main Store · <span lang="ko">성심당 본점</span></p>

<section class="say" aria-label="Order sentence">
  <p class="ko" lang="ko">튀김소보로 한 개 주세요.</p>
  <p class="ro">twigim-soboro han gae juseyo</p>
  <p class="me">“One Fried Soboro, please.”</p>
  <div class="lis">
    <button><svg class="i" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>Listen</button>
    <button><svg class="i" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>Listen slowly</button>
  </div>
</section>

<div class="seg" role="group" aria-label="To go or for here">
  <button aria-pressed="false"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>To go</button>
  <button aria-pressed="true">For here</button>
</div>

<div class="item">
  <div><b>Fried Soboro</b><span><span lang="ko">튀김소보로</span> · <span class="n">₩1,700</span></span></div>
  <div class="step"><button aria-label="Remove one"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><span class="q">1</span><button class="plus" aria-label="Add one"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button></div>
</div>
<p class="est"><span>Est. total · sample prices</span><span class="n">₩1,700</span></p>

<div class="dock">
  <button class="cta"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M10 7h4M9.5 11h5M9.5 14h5"/></svg>Show to staff</button>
  <button class="sec"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Practice saying it</button>
</div>
</body></html>
