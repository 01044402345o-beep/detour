<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edulleo 시연 QR</title>
<!-- 시연 슬라이드 1장 (task.md T3.3, PRD F-17). 16:9 고정 비율, 화면 크기에 맞춰 확대·축소.
     QR 원본: ../app/public/qr.svg (내용 https://01044402345o-beep.github.io/edulleo/, reviews/T3.3_qr.md 디코드 검증)
     외부 글꼴·스크립트 없음 — 시연장 네트워크가 없어도 그대로 열림. 색은 app/src/styles/tokens.css 값. -->
<style>
  :root {
    --ink: #151a26; --ink2: #2b3346; --soft: #656c81; --paper: #fbf7ef; --card: #ffffff;
    --line: #ece4d6; --acc: #ee6a3c; --acc-d: #b3461c; --sea: #13807e; --stage: #0e121b;
    --kfont: 'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --dfont: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--stage); overflow: hidden; font-family: var(--kfont); color: var(--ink); }
  /* 1600×900 기준으로 그리고, 화면에 맞춰 비율 유지 */
  .slide {
    position: fixed; left: 50%; top: 50%; width: 1600px; height: 900px; background: var(--paper);
    display: grid; grid-template-columns: 1fr 620px; align-items: center; gap: 80px;
    padding: 0 120px; overflow: hidden;
    transform-origin: center; transform: translate(-50%, -50%);
  }
  .slide::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--acc); }
  .eyebrow { font-size: 26px; font-weight: 700; color: var(--sea); letter-spacing: .02em; }
  h1 { font-size: 112px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin-top: 18px; }
  .en { font-family: var(--dfont); font-size: 44px; color: var(--acc-d); margin-top: 12px; font-style: italic; }
  .tagline { font-size: 38px; line-height: 1.45; color: var(--ink2); margin-top: 48px; font-weight: 600; word-break: keep-all; }
  .url { margin-top: 56px; font-size: 24px; white-space: nowrap; font-weight: 700; color: var(--ink); font-family: ui-monospace, Consolas, monospace;  }
  .url small { display: block; font-family: var(--kfont); font-size: 22px; font-weight: 600; color: var(--soft); margin-bottom: 8px; }
  .qr { background: var(--card); border: 2px solid var(--line); border-radius: 32px; padding: 36px; text-align: center; box-shadow: 0 20px 60px rgba(21,26,38,.12); }
  .qr img { width: 540px; height: 540px; display: block; image-rendering: pixelated; }
  .qr p { margin-top: 20px; font-size: 28px; font-weight: 700; color: var(--ink2); }
</style>
<script>
  // 1600×900 슬라이드를 창 크기에 맞춰 비율 유지 확대·축소
  function fit() { var s = Math.min(innerWidth / 1600, innerHeight / 900); document.querySelector('.slide').style.transform = 'translate(-50%, -50%) scale(' + s + ')'; }
  addEventListener('resize', fit); addEventListener('DOMContentLoaded', fit);
</script>
</head>
<body>
  <main class="slide" aria-label="Edulleo 시연 접속 안내">
    <section>
      <div class="eyebrow">지역문제 해결 아이디어 · 시연</div>
      <h1>Edulleo</h1>
      <div class="en">에둘러 · Daejeon walks</div>
      <p class="tagline">외국인 방문객용 대전 원도심 동선·주문 카드·현장 한국어 웹앱</p>
      <p class="url"><small>휴대폰으로 QR을 찍거나 주소를 입력하세요</small>https://01044402345o-beep.github.io/edulleo/</p>
    </section>
    <figure class="qr">
      <img src="../app/public/qr.svg" alt="QR 코드: https://01044402345o-beep.github.io/edulleo/">
      <p>카메라로 스캔 → 바로 체험</p>
    </figure>
  </main>
</body>
</html>
